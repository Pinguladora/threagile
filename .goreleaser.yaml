version: 2

project_name: threagile

before:
  hooks:
    - go mod download # Ensures dependencies are fetched before build starts

builds:
  - id: production
    main: ./cmd/threagile
    binary: threagile
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath # Removes local system paths
      - -buildvcs=false # Removes dependency on the local .git state
    ldflags:
      - -s -w # Strips debug info
      - -buildid= # Zeroes out the build ID for hash parity
      - -X main.buildTimestamp={{.CommitDate}} # Use CommitDate, NOT current time
      - -extldflags="-static"
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      # AMD64 tiers
      - linux_amd64_v3 # Baseline: AVX2, BMI2 (Haswell+ 2013)
      - linux_amd64_v4 # Performance: AVX-512 (Ice Lake+)
      - windows_amd64_v3
      - windows_amd64_v4
      - darwin_amd64_v3
      - darwin_amd64_v4
      # ARM64 tiers
      - linux_arm64_v8.0 # Baseline: RPi 3/4/5, Jetson Nano, most IoT SBCs
      - linux_arm64_v9.0 # Performance: Cortex-X2+, Neoverse V2+
      - darwin_arm64_v8.0
      - darwin_arm64_v9.0
    # only runs on actual tags/releases
    skip: "{{ .IsSnapshot }}"

  # The binaries of the container image, for the baseline variants that dockers_v2 takes for linux/amd64 and
  # linux/arm64 (v1 and v8.0), so that the image runs on any CPU of its architecture.
  - id: image
    main: ./cmd/threagile
    binary: threagile
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -buildid=
      - -X main.buildTimestamp={{.CommitDate}}
      - -extldflags="-static"
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0

  - id: dev
    main: ./cmd/threagile
    binary: threagile
    env:
      - CGO_ENABLED=0
    gcflags:
      - all=-N -l # Disable optimizations and inlining for better debugging
    ldflags:
      - -X main.buildTimestamp={{.Version}}-dev
      - -extldflags="-static"
    targets:
      - linux_amd64_v3
      - linux_amd64_v4
      - windows_amd64_v3
      - windows_amd64_v4
      - darwin_amd64_v3
      - darwin_amd64_v4
      - linux_arm64_v8.0
      - linux_arm64_v9.0
      - darwin_arm64_v8.0
      - darwin_arm64_v9.0
    # only runs on snapshot builds
    skip: "{{ not .IsSnapshot }}"

report_sizes: true

gomod:
  proxy: true # Verifiable builds: fetch modules from the proxy
  mod: readonly # Prevent accidental go.mod/go.sum changes during build

dockers_v2:
  # The binary of the image build and typst, which renders the PDF report, on the minimal hi/static base; see the
  # Containerfile. Both are static, so nothing else is installed.
  - id: threagile-image
    ids: [image]
    dockerfile: Containerfile
    images:
      - ghcr.io/pinguladora/threagile
    tags:
      - latest
      - "{{.Tag}}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.source: "{{.GitURL}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.licenses: MIT
    # the image records the commit time, not the build time
    build_args:
      SOURCE_DATE_EPOCH: "{{.CommitTimestamp}}"

archives:
  - id: standard
    ids: [production, dev]
    allow_different_binary_count: true
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with `uname`.
    name_template: >-
      {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "arm64" }}aarch64 {{- else }}{{ .Arch }}{{ end }} {{- with .Amd64 }}_{{ . }}{{ end }} {{- with .Arm64 }}_{{ . }}{{ end }}
    # The run-time assets are embedded in the binary, so only the docs ship with it.
    files:
      - LICENSE.txt
      - README.md
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  format: "{{ .Message }}"
  groups:
    - title: "Breaking Changes"
      regexp: '^.*?(\([[:word:]]+\))??!:.+$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: "Dependency Updates"
      regexp: '^.*?(feat|fix|chore)\(deps?.+\)!?:.+$'
      order: 300
    - title: "Miscellaneous Work"
      order: 999
  filters:
    exclude:
      - '^test(\(.+\))?:'
      - '^refactor(\(.+\))?:'
      - '^style(\(.+\))?:'

release:
  prerelease: auto
  include_meta: true
  footer: |
    **Full Changelog**: https://github.com/Pinguladora/threagile/compare/{{ .PreviousTag }}...{{ .Tag }}

sboms:
  - id: cyclonedx
    artifacts: archive
    cmd: syft
    args:
      - "scan"
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"
    documents:
      - "${artifact}.cdx.json"
  - id: spdx
    artifacts: archive
    cmd: syft
    args:
      - "scan"
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
    documents:
      - "${artifact}.spdx.json"

signs:
  - id: keyless-blob-sign
    artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

docker_signs:
  - id: keyless-image-sign
    artifacts: all
    cmd: cosign
    args:
      - "sign"
      # Sign by digest, not tag: it pins exactly what was pushed without racing a
      # moving tag.
      - "${artifact}@${digest}"
      - "--yes"
    output: true
