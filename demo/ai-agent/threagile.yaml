threagile_version: 1.0.0

# An AI support assistant: an agent that answers customers from a knowledge index (RAG), remembers resolved
# conversations, and acts on orders through the tools of an MCP server. It shows the AI technologies (llm,
# ai-agent, vector-database, mcp-server and model-registry) and the risks the AI rules find for them.

title: AI Support Assistant

date: 2026-11-04

author:
  name: John Doe
  homepage: www.example.com

management_summary_comment: >
  The assistant acts for the customers: besides answering, it changes orders and issues refunds.

business_criticality: critical

business_overview:
  description: Customers get answers and refunds in the support chat at any time, without waiting for an agent.
  images: []

technical_overview:
  description: >
    The support agent plans with a hosted language model, checks requests and answers with a self-hosted guardrail
    model, retrieves articles from a vector index and calls tools through an MCP server.
  images: []

questions:
  Which actions of the agent need a human approval?: ""
  How is the knowledge index kept free of untrusted content?: ""

abuse_cases:
  Refund Fraud: >
    As a customer I want to talk the assistant into refunding an order I have received, to keep the goods and
    get the money back.
  Data Theft: >
    As an attacker I want to make the assistant reveal the orders and addresses of other customers.
  Memory Poisoning: >
    As an attacker I want to plant instructions in the memory of the agent, so that it follows them in the
    conversations of other customers.

security_requirements:
  Least Agency: The agent may only act on the orders of the customer it talks to.
  Human Approval: Refunds above a limit need the approval of a support employee.

tags_available:
  - human-in-the-loop

