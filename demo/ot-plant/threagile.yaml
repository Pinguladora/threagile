threagile_version: 1.0.0

# A water treatment plant: a SCADA system with PLCs, a remote pump station and a chlorine safety system,
# separated from the corporate network by an industrial DMZ. It shows the OT technologies (plc, rtu,
# safety-controller, field-device, hmi, scada-server, historian and engineering-workstation), the industrial
# control protocols and the risks the OT rules find for them.

title: Water Treatment Plant

date: 2026-11-04

author:
  name: John Doe
  homepage: www.example.com

management_summary_comment: >
  The plant supplies the drinking water of the town; a failure of the dosing or of the safety function
  endangers the public and the operators.

business_criticality: mission-critical

business_overview:
  description: The plant treats raw water into drinking water and pumps it to the town around the clock.
  images: []

technical_overview:
  description: >
    A SCADA server supervises the dosing and filter PLCs and a remote pump station. A safety controller closes the
    chlorine supply on a leak. The corporate network reaches the plant through an industrial DMZ with a jump host
    and a replica of the historian.
  images: []

questions:
  Can the controllers be switched to RUN mode with the key switch?: ""
  Which remote access does the vendor need, and when?: ""

abuse_cases:
  Chlorine Overdose: >
    As an attacker I want to raise the chlorine setpoint of the dosing PLC to poison the drinking water.
  Supply Outage: >
    As an attacker I want to stop the pumps of the pump station to cut the water supply of the town.
  Safety Bypass: >
    As an attacker I want to disable the safety controller first, so that a chlorine leak goes unnoticed.

security_requirements:
  Zones and Conduits: IT reaches the plant only through the industrial DMZ.
  Safety Independence: The safety controller is changed only from a dedicated safety engineering workstation.

tags_available:
  - industrial-dmz

