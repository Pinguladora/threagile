threagile_version: 1.0.0

# A web shop on a managed Kubernetes cluster: namespaces with and without network policies, a privileged node agent
# and an operator that changes the cluster through its API. It shows the Kubernetes rules at work.

title: Web Shop on Kubernetes

date: 2026-11-07

author:
  name: Jane Doe
  contact: jane.doe@example.com

business_criticality: critical

business_overview:
  description: An online shop whose services run in a managed Kubernetes cluster.
  images: []

technical_overview:
  description: The shop's services run in namespaces of one cluster on a shared node pool. An ingress controller takes
    the traffic of the customers, a GitOps operator applies the deployments, and a node agent collects the logs.
  images: []

questions: {}

abuse_cases: {}

security_requirements: {}

tags_available: []

data_assets:

  Customer Orders:
    id: orders
    description: The orders of the customers, with their addresses
    usage: business
    tags: []
    origin: Customers
    owner: Shop Operations
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: critical
    justification_cia_rating: Personal data of the customers, and the business of the shop

  Payment Tokens:
    id: payment-tokens
    description: Tokens of the payment provider for the cards of the customers
    usage: business
    tags: []
    origin: Payment Provider
    owner: Shop Operations
    quantity: many
    confidentiality: strictly-confidential
    integrity: mission-critical
    availability: critical
    justification_cia_rating: Stolen tokens let attackers charge the cards of the customers

  Product Catalog:
    id: catalog
    description: The products and their prices
    usage: business
    tags: []
    origin: Shop Operations
    owner: Shop Operations
    quantity: many
    confidentiality: public
    integrity: important
    availability: important
    justification_cia_rating: Public, but wrong prices cost money

  Cluster Configuration:
    id: cluster-config
    description: The manifests of the workloads, applied by the operator
    usage: devops
    tags: []
    origin: Platform Team
    owner: Platform Team
    quantity: few
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: Changing them changes what runs in the cluster

