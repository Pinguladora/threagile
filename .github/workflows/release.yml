name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      id-token: write # octo-sts OIDC exchange + cosign keyless signing
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    env:
      # The release and verify tasks live in mise.ci.toml which loads only when
      # MISE_ENV=ci so set it for the whole job not just the mise-action step.
      MISE_ENV: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 uploads.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 dl.google.com:443 go.dev:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443 timestamp.sigstore.dev:443 token.actions.githubusercontent.com:443 octo-sts.dev:443
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: "blob:none"
      - name: Obtain release token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguladora/threagile
          identity: release
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Run release
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Generate subject hashes for SLSA provenance
        id: hash
        run: |
          echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # SLSA Level 3 provenance
  # ---------------------------------------------------------------------------

  provenance-binaries:
    name: SLSA provenance (binaries)
    needs: release
    permissions:
      actions: read # Required by the SLSA generator
      id-token: write # SLSA provenance signing
      contents: write # Attestation upload
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: false
      provenance-name: provenance-binaries.intoto.jsonl
      private-repository: false

  # ---------------------------------------------------------------------------
  # Post-release verification
  # ---------------------------------------------------------------------------

  verify:
    name: Verify release
    needs: [release, provenance-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      id-token: write # octo-sts OIDC exchange
      actions: read # Download provenance workflow artifacts
    env:
      MISE_ENV: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 dl.google.com:443 go.dev:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443 token.actions.githubusercontent.com:443 octo-sts.dev:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtain verify token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguladora/threagile
          identity: verify
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download release artifacts for verification
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release download "${VERSION}" \
            -R "${GITHUB_REPOSITORY}" \
            -p "threagile_Linux_x86_64_v3.tar.gz" \
            -p "threagile_Windows_x86_64_v3.zip" \
            -p "checksums.txt" \
            -p "checksums.txt.sigstore.json"
      - name: Download binary provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-binaries.intoto.jsonl
      - name: Verify binary (Linux tar.gz)
        run: mise run verify:binary threagile_Linux_x86_64_v3.tar.gz
      - name: Verify binary (Windows zip)
        run: mise run verify:binary threagile_Windows_x86_64_v3.zip
