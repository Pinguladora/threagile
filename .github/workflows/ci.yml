name: CI

# The Go gate for every pull request. It runs the same checks as the local hk
# hooks (format, tidy, build, vet, test, lint) through mise, so contributors who
# do not have the hooks installed still get them enforced. Everything runs via
# `mise run ci:check` (see mise.ci.toml), keeping the pipeline portable across
# CI systems.
# A change to the docs or to the Markdown files at the root alone runs nothing, except to the docs that tests check
# against the code. Later patterns win, so those are listed after the exclusions.
# Main runs it only to save the caches of the tools and of the Go builds: a pull request can restore the caches of
# main, but not those of another pull request. So it runs there only when what their keys hash changes.
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - docs/flags.md
      - docs/types.md
  push:
    branches: [main]
    paths:
      - go.sum
      - mise*.toml
      - mise*.lock
      - .miserc*
      - .github/workflows/ci.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    env:
      # ci activates mise.ci.toml (the ci:* tasks) on top of mise.toml.
      MISE_ENV: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 tuf-repo-cdn.sigstore.dev:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 dl.google.com:443 go.dev:443 nodejs.org:443 registry.npmjs.org:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Cache the Go build and module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Run CI checks
        run: mise run ci:check

  pdf:
    name: PDF compliance
    # Renders the PDF reports of the demos with typst and checks them with veraPDF as PDF/A-3a and PDF/UA-1. veraPDF
    # runs from its container image, which is amd64 only, as the runner is.
    # Not on main: it saves no cache of its own, and its builds without the race detector would take the key of the
    # Go check's if it finished first.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    env:
      MISE_ENV: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 tuf-repo-cdn.sigstore.dev:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 dl.google.com:443 go.dev:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443 registry-1.docker.io:443 auth.docker.io:443 production.cloudfront.docker.com:443 production.cloudflare.docker.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Cache the Go build and module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Check the PDF reports with veraPDF
        run: mise run pdf:validate

  mutation:
    name: Mutation testing
    # Mutates the Go files that a pull request changes in the rules, the model and the types, and reports the mutants
    # that the tests miss in the job summary. It does not fail the build: some mutants are equivalent (they cannot
    # change behaviour).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    env:
      MISE_ENV: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 tuf-repo-cdn.sigstore.dev:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 dl.google.com:443 go.dev:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gomu diffs against the base commit of the pull request
      - name: Set up mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      # Most pull requests, dependency updates among them, change none of the files it mutates. Finding out first
      # skips the Go cache and the run for them.
      - name: List the changed files to mutate
        id: changed
        env:
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The task prints only the file names, and a failure of it fails the step.
          files=$(mise run -q test:mutation --list)
          if [ -n "$files" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo '## Mutation testing'
            if [ -z "$files" ]; then echo 'No changed Go files to mutate.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cache the Go build and module cache
        if: steps.changed.outputs.any == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Mutate the changed files
        if: steps.changed.outputs.any == 'true'
        env:
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mise run test:mutation | tee mutation.txt
          {
            echo '```'
            grep -E '^(\[|Mutation Score|No changed)' mutation.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
