name: Lint GitHub Actions

# Security-audit and lint the workflows themselves with zizmor and actionlint,
# run through mise (`mise run lint:gha`) so the pipeline stays portable. The same
# tools run locally via the hk pre-push hook, so this is the enforcement path for
# contributors who do not have the hooks installed.
# Pull requests only: main gets nothing a pull request has not already checked.
on:
  pull_request:
    paths:
      - ".github/zizmor.yml"
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Analyze actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout; zizmor uses the token for its online audits
    env:
      MISE_ENV: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 tuf-repo-cdn.sigstore.dev:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 dl.google.com:443 go.dev:443 nodejs.org:443 registry.npmjs.org:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Lint workflows
        run: mise run lint:gha
        env:
          GITHUB_TOKEN: ${{ github.token }}
