[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
minimum_release_age = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]
lockfile_platforms = ["linux-x64", "linux-arm64", "linux-x64-musl", "macos-x64", "macos-arm64", "windows-x64"]
# Decide task freshness by hashing source contents, not mtimes. A fresh checkout
# resets mtimes, so mtime comparison would rebuild needlessly, while content
# hashing skips when the bytes are equal.
task.source_freshness_hash_contents = true

[tools]
# Tools shared by local dev and CI. Local-only tooling (linters, formatters, git
# hooks) lives in mise.dev.toml and loads via .miserc's `dev` env, never in CI
# (MISE_ENV=ci). A tool sits here when both local work and CI need it:
# go/golangci-lint (Go work + CI), goreleaser/syft (local snapshot + release CI),
# actionlint/zizmor (local hk hooks + the lint:gha CI job), typst (PDF report tests).
cocogitto = "7.0.0"
go = "1.27.3"
# Built from source so it compiles against the pinned go. The prebuilt
# golangci-lint releases are still built with go1.26 and panic on a `go 1.27`
# go.mod. Switch back to the plain `golangci-lint` tool once upstream ships a
# go1.27 build.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.15.0"
goreleaser = "2.19.0"
syft = "1.55.0"
actionlint = "1.7.12"
zizmor = "1.31.1"
# Renders the PDF report at run time (the binary runs it when it is on the PATH); the tests and CI render with it.
"aqua:typst/typst" = "0.15.1"

[tasks."secret:scan"]
run = "kingfisher scan . --no-validate --redact"
description = "Scan codebase for secrets with Kingfisher"
alias = "ss"

[tasks."secret:validate"]
run = "kingfisher scan . --redact"
description = "Validate and revoke live secrets found by Kingfisher"
alias = "sv"

[tasks.bump]
run = "cog bump --auto"
description = "Calculate next version from conventional commits and tag"

[tasks.lint]
description = "Run all linting"
depends = ["lint:*"]

[tasks.build]
run = "go build ./..."
description = "Build all Go packages"
alias = "b"

[tasks.test]
run = "go test ./..."
description = "Run all Go tests"
alias = "t"

[tasks.snapshot]
run = "goreleaser release --snapshot --clean --skip=sign,sbom,docker"
description = "Local snapshot build with GoReleaser (skips signing, SBOM, and the container image)"
alias = "snap"

[tasks."snapshot:container"]
run = "goreleaser release --snapshot --clean --skip=sign,sbom"
description = "Local snapshot build including the container image (needs docker buildx; skips signing, SBOM)"
alias = "snapc"

[tasks."image:check"]
description = "Render the PDF report of the example with the container image of snapshot:container"
# The snapshot builds one image per platform, tagged with the platform; this runs the amd64 one.
run = '''
#!/usr/bin/env bash
set -euo pipefail
engine="${CONTAINER_ENGINE:-docker}"
out="$(mktemp -d)"
trap 'rm -rf "${out}"' EXIT
chmod 777 "${out}" # the image runs as an unprivileged user
cp demo/example/threagile.yaml "${out}/"
"${engine}" run --rm -v "${out}:/work:Z" ghcr.io/pinguladora/threagile:latest-amd64 \
  analyze-model --model /work/threagile.yaml --output /work --skip-report-adoc
test -s "${out}/report.pdf"
echo "the image renders the PDF report"
'''

[tasks."lint:go"]
run = "golangci-lint run ./... --fix"
description = "Lint Go code with autofix"
sources = ["**/*.go", ".golangci.yaml"]

[tasks."lint:gha"]
# actionlint catches workflow syntax and expression errors; zizmor runs the
# security static analysis. zizmor runs offline without a token (local) and does
# the online audits when GITHUB_TOKEN is set (the lint-gha CI job passes it).
run = [
  "actionlint -color -shellcheck=",
  "zizmor --config .github/zizmor.yml .github/workflows",
]
description = "Lint and security-audit the GitHub Actions workflows (actionlint + zizmor)"
sources = [".github/workflows/**", ".github/zizmor.yml"]

[tasks.fmt]
run = "gofmt -w ."
description = "Format all Go code"
alias = "f"

[tasks."fmt:check"]
run = """
files=$(gofmt -l .)
if [ -n "$files" ]; then
  echo "Not gofmt-clean, run 'mise run fmt':"
  echo "$files"
  exit 1
fi
"""
description = "Fail if any Go file is not gofmt-clean"

[tasks.vet]
run = "go vet ./..."
description = "Vet all packages"

[tasks.tidy]
run = "go mod tidy"
description = "Tidy go.mod and go.sum"

# Pre-commit gate. Run before every atomic commit.
[tasks.check]
description = "Pre-commit gate: format, vet, build, test, lint"
depends = ["fmt:check", "vet", "build", "test", "lint"]

# ---------------------------------------------------------------------------
# Threat-model workflows. The analysed model defaults to the bundled example;
# pass another with `mise run analyze path/to/threagile.yaml`.
# ---------------------------------------------------------------------------

[tasks.analyze]
description = "Analyse a threat model and write every report into out/"
run = '''
#!/usr/bin/env bash
set -euo pipefail
MODEL="{{arg(i=0, name="model", default="demo/example/threagile.yaml")}}"
mkdir -p out
go run ./cmd/threagile analyze-model \
  --model "${MODEL}" \
  --output out \
  --app-dir . \
  --ignore-orphaned-risk-tracking
'''
alias = "a"

[tasks."pdf:validate"]
description = "Render the PDF reports of the demos and check them with veraPDF as PDF/A-3a and PDF/UA-1"
# veraPDF runs from its container image (amd64 only): conda-forge has no arm64 build either, and mise cannot lock a
# tool for some platforms only. CONTAINER_ENGINE picks docker (the default) or podman.
run = '''
#!/usr/bin/env bash
set -euo pipefail
engine="${CONTAINER_ENGINE:-docker}"
image="docker.io/verapdf/cli:v1.30.3@sha256:d74b7026c18a0f171e73c153b617fe6520e1511feb24ca98a348b2bb897669fb"
out="$(mktemp -d)"
trap 'rm -rf "${out}"' EXIT
for demo in example ai-agent; do
  mkdir -p "${out}/${demo}"
  go run ./cmd/threagile analyze-model --model "demo/${demo}/threagile.yaml" --output "${out}/${demo}" \
    --temp-dir "${out}" --skip-report-adoc --skip-risks-excel --skip-tags-excel
  for flavour in ua1 3a; do
    "${engine}" run --rm -v "${out}/${demo}:/data:Z" "${image}" --flavour "${flavour}" /data/report.pdf \
      > "${out}/${demo}/verapdf-${flavour}.xml" || true
    if ! grep -q 'isCompliant="true"' "${out}/${demo}/verapdf-${flavour}.xml"; then
      echo "${demo}: report.pdf is not compliant with ${flavour}:" >&2
      grep -o 'clause="[^"]*" testNumber="[0-9]*" status="failed"[^>]*' "${out}/${demo}/verapdf-${flavour}.xml" >&2 || true
      exit 1
    fi
    echo "${demo}: report.pdf is compliant with ${flavour}"
  done
done
'''

[tasks.serve]
# --server-dir is where the static UI lives (server/static); the server also
# writes its API keys under server/keys, which is gitignored.
run = "go run ./cmd/threagile server --app-dir . --server-dir server --temp-dir out/tmp"
description = "Run the threagile REST server and model editor on :8080"
