version: "2"
run:
  tests: true
  go: "1.26"
  concurrency: 4
  timeout: 10m

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errname
    - exptostd
    - fatcontext
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocritic
    - gocognit
    - goconst
    - godoclint
    - godot
    - godox
    - gosec
    - govet
    - ineffassign
    - intrange
    - lll
    - mnd
    - modernize
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - spancheck
    - staticcheck
    - tagalign
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck
    - zerologlint
  settings:
    # fieldalignment is left off: reordering struct fields changes the field order
    # of the JSON and YAML that threagile writes (risks.json, macro-edited models).
    govet:
      enable-all: false
    goconst:
      min-len: 3
      min-occurrences: 3
    godox:
      keywords: [TODO, BUG, FIXME, OPTIMIZE, HACK]
    # Errors from threagile's own packages already carry curated messages (the model
    # checks, the config and macro errors); wrapping them again only repeats context.
    wrapcheck:
      ignore-package-globs:
        - github.com/Pinguladora/threagile/*
    nolintlint:
      require-explanation: false
      require-specific: true
      allow-unused: false
    # The string-builder rewrites are off: the stringsbuilder autofix mis-nests
    # builders for nested loops (it moved the ids outside their `{ rank=same; }`
    # group in the Graphviz same-rank tweak), and these strings are small.
    # omitzero is off too: switching omitempty to omitzero on nested structs would
    # change which fields threagile writes into JSON and YAML.
    modernize:
      disable: [stringsbuilder, omitzero]
    # File modes (0o700, 0o600, ...) are self-describing.
    mnd:
      ignored-functions:
        - ^os\.(Mkdir|MkdirAll|WriteFile|OpenFile|Chmod)$
    perfsprint:
      concat-loop: false
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true
    revive:
      max-open-files: 2048
      confidence: 0.8
      severity: warning
      enable-all-rules: false
      rules:
        - name: context-as-argument
        - name: defer
        - name: unexported-return
    usetesting:
      os-mkdir-temp: true
      os-setenv: true
      os-temp-dir: true
      os-create-temp: true
  exclusions:
    generated: lax
    rules:
      - linters: [goconst]
        path: (.+)_test\.go
      - linters: [gosec]
        text: "G204:"
      - linters: [nilnil, wrapcheck, funlen, gocognit, cyclop, mnd, dupl, lll]
        path: (.+)_test\.go
      # The PDF and Excel report writers position every element with literal
      # coordinates, sizes and colours; naming each one would not make the layout
      # any clearer.
      - linters: [mnd]
        path: ^pkg/report/
      # tagalign pads struct tags into columns, which pushes tagged fields past the
      # line limit; the two linters cannot both be satisfied on those lines.
      - linters: [lll]
        source: '`(json|yaml):"'
      # The (un)marshalling of the model types returns the encoding/json, yaml and
      # time errors as they are: wrapping them changes the model load errors users
      # see and hides encoding/json's field context (it asserts *UnmarshalTypeError).
      - linters: [wrapcheck]
        path: ^pkg/types/
      # The zip handlers' errors are the REST response bodies; wrapping changes them.
      - linters: [wrapcheck]
        path: ^pkg/server/zip\.go$
      # The enum types are parallel tables of names and descriptions by design.
      - linters: [goconst, dupl]
        path: ^pkg/types/
      # The comparison expressions of the script language are parallel per operator.
      - linters: [dupl]
        path: ^pkg/risks/script/expressions/
      # Two PDF layout functions are flat sequences of drawing calls (legend rows,
      # chart literals); splitting them further would only scatter the layout.
      - linters: [funlen]
        path: ^pkg/report/report\.go$
      # These marshal structs without tags on purpose: the CLI config embeds getter
      # interfaces, and types.Author and types.Overview are written with their
      # default keys; adding tags would rename keys in existing files.
      - linters: [musttag]
        path: ^(cmd/|internal/threagile/|pkg/risks/script/)
    paths: [third_party$, builtin$, examples$]
formatters:
  enable: [gci, gofumpt, goimports]
  settings:
    gci:
      sections:
        - standard
        - default
      custom-order: true
  exclusions:
    generated: lax
    paths: [third_party$, builtin$, examples$]
issues:
  new: false
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
